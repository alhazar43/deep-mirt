[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kt-mirt"
version = "0.0.1"
description = "Vendored deep ability-tracking core (encoders + IRT-flavored decoders) for multi-KC knowledge tracing research."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kt_mirt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
