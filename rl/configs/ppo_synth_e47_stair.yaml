# OrdRec E4.7 PPO config -- staircase cohort.
#
# Mirrors ppo_synth_e46b.yaml exactly except for:
#   - experiment_name, adapter, world_model: point to staircase data and checkpoint
#   - reward.resample_probe_at_terminal: true  (E4.7 gating fix for dynamic-world anchor)
#   - seed: 47
#
# World model: ordrec_synth_e47_stair/best.pt (QWK 0.689, r_theta~0.95, r_beta 0.973)
# Data: ma-irt/data/ordrec_synth_e47_stair/ (staircase, N=2000, Q=200, K=4, seq_len=60)
# Item cache: rl/artifacts/item_cache/ordrec_synth_e47_stair/aaf560b/item_cache.npz

experiment_name: ordrec_synth_e47_stair
output_dir: C:/Users/steph/Documents/deep-mirt/rl/outputs
device: cuda
seed: 47

adapter:
  type: synthetic
  name: ordrec_synth_e47_stair
  raw_dir: C:/Users/steph/Documents/deep-mirt/ma-irt/data/ordrec_synth_e47_stair
  out_dir: C:/Users/steph/Documents/deep-mirt/rl/artifacts
  split_seed: 42
  test_frac: 0.2
  valid_frac: 0.1
  min_seq_len: 10
  max_seq_len: 0
  chunk_long_sequences: false

world_model:
  n_traits: 1
  memory_size: 50
  key_dim: 64
  value_dim: 64
  summary_dim: 50
  embedding_type: learned
  dropout_rate: 0.0
  ability_scale: 1.0
  separate_theta: true
  init_value_memory: false
  checkpoint: C:/Users/steph/Documents/deep-mirt/ma-irt/outputs/ordrec_synth_e47_stair/best.pt

env:
  batch_size: 32
  warmup_len: 5
  split: train
  K_B: 5
  T: 10
  cache_n_contexts: 8
  cache_context_seq_len: 1

reward:
  w_info: 1.0
  w_cost: 0.05
  w_expo: 0.02
  w_voi: 5.0
  probe_M: 32
  probe_H: 20
  r_max: 0.40
  c_expo: 1.0
  expo_ema_decay: 0.99
  n_difficulty_strata: 5
  probe_sampler: stratified
  resample_probe_at_terminal: true

warmstart:
  enabled: true
  bc_updates: 200
  bc_episodes_per_update: 4
  mve_updates: 0
  mve_episodes_per_update: 0

ppo:
  total_updates: 500
  n_episodes_per_update: 32
  max_steps_per_episode: 2
  hyperparameters:
    hidden_dim: 128
    n_hidden_layers: 2
    learning_rate: 3.0e-4
    adam_eps: 1.0e-5
    clip_eps: 0.2
    gamma: 0.95
    gae_lambda: 0.95
    entropy_coef_initial: 0.01
    entropy_coef_final: 0.0
    entropy_anneal_fraction: 0.5
    value_coef: 0.5
    max_grad_norm: 0.5
    n_epochs: 4
    minibatch_size: 64
    target_kl: 0.02
