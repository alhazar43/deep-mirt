# OrdRec E4.5 PPO training config.
#
# Full headline run on the E4.5 synthetic cohort (N=2000, Q=200, K=4).
# World model: trained MAGPCM checkpoint from ordrec_synth_e45 training run.
#
# Strategic-plan hyperparameters (Section 4.4 / 5.2 of impl guide).
#   K_B=5, T=10  -> 2 env steps per episode
#   probe_M=32, probe_H=20  (uniform probe sampler, stratified is E4.6b)
#   Reward weights: w_info=1.0, w_cost=0.05, w_expo=0.1, w_voi=5.0
#   K_B credit assignment: full reward on first sub-step (known-suboptimal,
#     fixed in E4.6b). This run is side A of the A/B comparison.
#   Probe sampler: uniform (stratified lands in E4.6b).
#
# BC warm-start: 200 updates against max-Fisher teacher.
# PPO: 500 updates (confirmed against 1-2h wall-clock budget; see notes).
#
# Note on BC-only checkpoint: before PPO begins, the warm-start state
# is saved to outputs/ordrec_synth_e45_bc/bc_warmstart.pt so eval_e45.py
# can run it as a BC-only baseline.

experiment_name: ordrec_synth_e45
output_dir: outputs
device: cuda
seed: 42

adapter:
  type: synthetic
  name: ordrec_synth_e45
  raw_dir: ma-irt/data/ordrec_synth_e45
  out_dir: rl/artifacts
  split_seed: 42
  test_frac: 0.2
  valid_frac: 0.1
  min_seq_len: 10
  max_seq_len: 0
  chunk_long_sequences: false

world_model:
  n_traits: 1
  memory_size: 50
  key_dim: 64
  value_dim: 64
  summary_dim: 50
  embedding_type: learned
  dropout_rate: 0.0
  ability_scale: 1.0
  separate_theta: true
  init_value_memory: false
  checkpoint: ma-irt/outputs/ordrec_synth_e45/best.pt

env:
  batch_size: 32
  warmup_len: 5
  split: train
  K_B: 5
  T: 10
  cache_n_contexts: 8
  cache_context_seq_len: 1

reward:
  w_info: 1.0
  w_cost: 0.05
  w_expo: 0.10
  w_voi: 5.0
  probe_M: 32
  probe_H: 20
  r_max: 0.20
  c_expo: 1.0
  expo_ema_decay: 0.99
  n_difficulty_strata: 5

warmstart:
  enabled: true
  bc_updates: 200
  bc_episodes_per_update: 4
  mve_updates: 0
  mve_episodes_per_update: 0

ppo:
  total_updates: 500
  n_episodes_per_update: 32
  max_steps_per_episode: 2
  hyperparameters:
    hidden_dim: 128
    n_hidden_layers: 2
    learning_rate: 3.0e-4
    adam_eps: 1.0e-5
    clip_eps: 0.2
    gamma: 0.95
    gae_lambda: 0.95
    entropy_coef_initial: 0.01
    entropy_coef_final: 0.0
    entropy_anneal_fraction: 0.5
    value_coef: 0.5
    max_grad_norm: 0.5
    n_epochs: 4
    minibatch_size: 64
    target_kl: 0.02
