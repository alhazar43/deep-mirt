# DRL-MAIRT v2 synthetic dataset, full N=100,000 preset.
#
# Used by M5-RL training. Deferred until M5-RL; the M4-RL milestone
# validates only sim_v2_dev.yaml. Stratified 80,000 / 10,000 / 10,000
# split.

schema_flag: drlmairt_sim_v2
preset_name: sim_v2_100k
seed: 42
n_users: 100000
output_dir: rl/data/v2_100k
onet_parquet: rl/artifacts/onet_v1.parquet

users:
  theta_seed: 7
  lambda_seed: 11

gpcm:
  beta: [-1.5, -0.5, 0.5, 1.5]
  liked_category: 3

candidate_set:
  negbinom_r: 2.0
  negbinom_p: 0.05
  negbinom_clip: [1, 200]

split:
  train_frac: 0.80
  val_frac: 0.10
  test_frac: 0.10
  split_seed: 13
