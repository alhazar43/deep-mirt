# DRL-MAIRT v1 synthetic dataset, development preset.
#
# Small N=500 for fast iteration. Used by tests and quick analysis
# loops. See rl/configs/sim_v1_recovery.yaml for the N=5000 preset
# that anchors the headline recovery claim.

schema_flag: drlmairt_sim_v1
preset_name: sim_v1_dev
seed: 42
n_users: 500
output_dir: rl/data/sim_v1_dev
onet_parquet: rl/artifacts/onet_v1.parquet

user_bank:
  alpha_sigma: 0.4
  bmean_sigma: 0.7
  threshold_sigma: 0.5
  composition:
    - [2, 25]
    - [3, 15]
    - [5, 8]
    - [6, 2]

preference:
  delta_source: work_zone
  target_like_rate: 0.20
  rejecter_share: 0.40
  engaged_share: 0.60
  lambda_range: [0.5, 3.0]
  bias_range: [-2.0, 2.0]

candidate_set:
  negbinom_r: 2.0
  negbinom_p: 0.05
  negbinom_clip: [1, 200]
