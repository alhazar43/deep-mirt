# OrdRec E4.6b R1 ablation config.
#
# Same world-model and env geometry as ppo_synth_e45 but uses absolute
# paths so the ablation script can run from the worktree directory.
# Paths point to the main repo's data and outputs.

experiment_name: ordrec_synth_e46b_ablation
output_dir: outputs
device: cuda
seed: 42

adapter:
  type: synthetic
  name: ordrec_synth_e45
  raw_dir: C:/Users/steph/Documents/deep-mirt/ma-irt/data/ordrec_synth_e45
  out_dir: C:/Users/steph/Documents/deep-mirt/rl/artifacts
  split_seed: 42
  test_frac: 0.2
  valid_frac: 0.1
  min_seq_len: 10
  max_seq_len: 0
  chunk_long_sequences: false

world_model:
  n_traits: 1
  memory_size: 50
  key_dim: 64
  value_dim: 64
  summary_dim: 50
  embedding_type: learned
  dropout_rate: 0.0
  ability_scale: 1.0
  separate_theta: true
  init_value_memory: false
  checkpoint: C:/Users/steph/Documents/deep-mirt/ma-irt/outputs/ordrec_synth_e45/best.pt

env:
  batch_size: 32
  warmup_len: 5
  split: test
  K_B: 5
  T: 10
  cache_n_contexts: 8
  cache_context_seq_len: 1

reward:
  w_info: 1.0
  w_cost: 0.05
  w_expo: 0.10
  w_voi: 5.0
  probe_M: 32
  probe_H: 20
  r_max: 0.20
  c_expo: 1.0
  expo_ema_decay: 0.99
  n_difficulty_strata: 5
  probe_sampler: stratified
