# DRL-MAIRT v2 synthetic dataset, development preset.
#
# Small N=2000 for fast iteration. Used by the v2 generator tests and
# quick analysis loops. See sim_v2_100k.yaml for the full N=100,000
# preset that anchors M5-RL training.

schema_flag: drlmairt_sim_v2
preset_name: sim_v2_dev
seed: 42
n_users: 2000
output_dir: rl/data/v2_dev
onet_parquet: rl/artifacts/onet_v1.parquet

# v2 user prior.
users:
  theta_seed: 7
  lambda_seed: 11

# v2 GPCM step thresholds. K=5 categories.
gpcm:
  beta: [-1.5, -0.5, 0.5, 1.5]
  liked_category: 3  # IsLiked = 1[y >= 3]

# Per-user candidate set size, clipped NegBinom.
candidate_set:
  negbinom_r: 2.0
  negbinom_p: 0.05
  negbinom_clip: [1, 200]

# Stratified split fractions.
split:
  train_frac: 0.80
  val_frac: 0.10
  test_frac: 0.10
  split_seed: 13
