[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ordrec"
version = "0.0.1"
description = "OrdRec, ordinal item recommendation built on deep MA-IRT belief tracking."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
  { name = "Wenrui Yuan" },
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "pyarrow>=12.0",
]

# ma-irt is consumed from the repo root via PYTHONPATH=ma-irt rather than
# pip-installed; declaring it as an extra here makes the dependency explicit
# without forcing a setup-time install path.
[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ordrec*"]

[tool.setuptools.package-data]
"ordrec.data.tests" = ["fixtures/*.csv"]

[tool.pytest.ini_options]
testpaths = ["src/ordrec"]
python_files = ["test_*.py"]
