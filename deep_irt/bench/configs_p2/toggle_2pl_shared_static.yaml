# toggle_2pl_shared_static.yaml -- 2PL toggle 1/4: shared item key, static discrimination (baseline corner).

experiment: toggle_2pl_shared_static
description: "2PL toggle 1/4: shared item key, static discrimination (baseline corner)."

data:
  regime: realistic
  kind: static
  n_learners: 2000
  n_items: 200
  seq_len: 80
  n_cats: 2
  n_holdout: 10
  admin_min: 40
  admin_max: 80
  popularity: uniform
  alpha_sigma: 0.5

model:
  engine: deep_irt
  encoder: lstm
  decoder: binary
  emb_dim: 8
  hidden_dim: 32
  state_alpha: false
  state_beta: false

train:
  optimizer: adam
  n_epochs: 120
  lr: 0.01
  grad_clip_norm: 5.0
  early_stop_patience: 10

eval:
  n_data_seeds: 5
  n_init_seeds: 3
  n_folds: 5
  n_bootstrap: 2000
  gauge: affine
  paired_test: wilcoxon

report:
  output_dir: outputs/p2
  cell_name: toggle_2pl_shared_static
  quick: false
