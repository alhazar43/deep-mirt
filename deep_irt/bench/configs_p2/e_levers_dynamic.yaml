# e_levers_dynamic.yaml -- E-levers treatment: dynamic alpha head (state_alpha=True).
# Run the static control by copying, setting state_alpha: false,
# and renaming cell_name to e_levers_static.
#
# Blueprint: {static, dynamic head} x {gpcm, nrm}, 8+ data seeds.
# Expected: dynamic head rescues GPCM alpha; static wins real reliability.
# NRM confound controls: hold K, N, Q, seeds; score slope VECTOR; param-count-matched
# control; report c_k. (NRM variant uses decoder: nrm in a separate cell.)

experiment: e_levers_dynamic
description: "E-levers: dynamic alpha head (state_alpha=True), GPCM decoder, static ability."

data:
  kind: static
  n_learners: 800
  n_items: 60
  seq_len: 60
  n_cats: 4
  n_holdout: 10

model:
  engine: deep_irt
  encoder: lstm
  decoder: gpcm
  emb_dim: 8
  hidden_dim: 32
  state_alpha: true   # the dynamic lever; set false for the control cell
  state_beta: false

train:
  optimizer: adam
  n_epochs: 150
  lr: 1.0e-2
  grad_clip_norm: 5.0

eval:
  n_data_seeds: 8      # blueprint: 8+ seeds for E-levers
  n_init_seeds: 3
  n_bootstrap: 2000
  gauge: affine
  paired_test: wilcoxon

report:
  output_dir: outputs/p2
  cell_name: e_levers_dynamic
  quick: false
