# bench_lstm_gpcm_rw.yaml -- Drift arm: LSTM x GPCM, random-walk theta, realistic PRIMARY bed.

experiment: bench_lstm_gpcm_rw
description: "Drift arm: LSTM x GPCM, random-walk theta, realistic PRIMARY bed."

data:
  regime: realistic
  kind: dynamic
  n_learners: 2000
  n_items: 200
  seq_len: 80
  n_cats: 4
  n_holdout: 10
  admin_min: 40
  admin_max: 80
  popularity: uniform
  alpha_sigma: 0.5
  drift_sigma: 0.15

model:
  engine: deep_irt
  encoder: lstm
  decoder: gpcm
  emb_dim: 8
  hidden_dim: 32
  state_alpha: false
  state_beta: false

train:
  optimizer: adam
  n_epochs: 120
  lr: 0.01
  grad_clip_norm: 5.0
  early_stop_patience: 10
  gpcm_loss: ordinal_ce

eval:
  n_data_seeds: 5
  n_init_seeds: 3
  n_folds: 5
  n_bootstrap: 2000
  gauge: affine
  paired_test: wilcoxon

report:
  output_dir: outputs/p2
  cell_name: bench_lstm_gpcm_rw
  quick: false
