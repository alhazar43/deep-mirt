# e2_coupling.yaml -- E2(a) coupling arm: ability_coupling COUPLED.
# Run the decoupled control by copying this file, setting coupled_theta: false,
# and renaming cell_name to e2_decoupled.
#
# Blueprint: E2(a) coupling -> IDENTIFIABILITY (structural).
# Readout: beta (b) rank recovery. Under coupling, a global affine cannot
# rescue the per-item flat directions; degraded b_spearman IS the signature.
#
# Vehicle: ma_irt engine with separate_theta toggle.
# OPEN DECISION: see _p2_coupled_theta.py for Vehicle A vs B resolution.

experiment: e2_coupling
description: "E2(a): item-conditioned theta (coupled), ma_irt LSTM engine, GPCM decoder."

data:
  kind: static
  n_learners: 800
  n_items: 60
  seq_len: 60
  n_cats: 4
  n_holdout: 10

model:
  engine: ma_irt
  encoder: lstm_gpcm
  decoder: gpcm
  # coupled_theta: true -> separate_theta=False in MaIrtEngine
  coupled_theta: true
  ma_irt_kwargs:
    d_model: 32
    key_dim: 32
    value_dim: 32

train:
  optimizer: adam
  n_epochs: 120
  lr: 1.0e-2

eval:
  n_data_seeds: 5
  n_init_seeds: 3
  n_bootstrap: 2000
  gauge: affine
  paired_test: wilcoxon

report:
  output_dir: outputs/p2
  cell_name: e2_coupling
  quick: false
