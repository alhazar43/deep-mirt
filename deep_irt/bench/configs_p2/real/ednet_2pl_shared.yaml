# Real-data reliability cell: 2PL on EdNet-KT1 (binary correctness), SHARED arm.
# Split-half reliability of recovered alpha (Spearman) + beta (Pearson),
# Spearman-Brown corrected, guarded by held-out accuracy.  No ground truth.
dataset: ednet
decoder: 2pl
arm: shared
n_learners: 3000
n_items: 250
max_seq_len: 200
min_answers: 20
scan_files: 30000
n_epochs: 150
lr: 0.01
batch_size: 512
hidden_dim: 32
n_holdout: 10
n_splits: 4
seed: 42
