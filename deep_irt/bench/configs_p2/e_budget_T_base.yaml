# e_budget_T_base.yaml -- E-budget (i): training-T sweep base config.
# This is the TEMPLATE; the actual grid is produced by
#   _p2_datagen_budget.make_T_grid(base_cfg, T_values=[10,20,40,80,160,320])
# which deep-copies this config per T value and sets train.n_epochs accordingly.
#
# Blueprint: fit gap(T) = A*exp(-T/kappa) + c on plain GD (not Adam).
# Plain GD: kappa is not compressed by Adam preconditioning -> cleaner reading.
# Adam arm: duplicate with optimizer: adam to show compression separately.
#
# n_data_seeds: 10 per blueprint for E-budget grid points.

experiment: e_budget_T_base
description: "E-budget T-sweep base: plain GD, static GPCM, 10 data seeds. Grid generated by make_T_grid."

data:
  kind: static
  n_learners: 800
  n_items: 60
  seq_len: 60
  n_cats: 4
  n_holdout: 10

model:
  engine: deep_irt
  encoder: lstm
  decoder: gpcm
  emb_dim: 8
  hidden_dim: 32

train:
  optimizer: sgd        # plain GD; Adam arm uses optimizer: adam
  n_epochs: 80          # overridden per grid point by make_T_grid
  lr: 5.0e-3            # GD needs smaller lr than Adam to converge stably

eval:
  n_data_seeds: 10      # blueprint: 10 seeds per grid point
  n_init_seeds: 1
  n_bootstrap: 2000
  gauge: affine

report:
  output_dir: outputs/p2
  cell_name: e_budget_T_base  # suffixed to _T{value} by make_T_grid
  quick: false
