# bench_dkvmn_nrm.yaml -- Benchmark (fixed setup) dkvmn encoder x NRM decoder, static theta, realistic PRIMARY bed (Q=200, admin Uniform(40,80)).

experiment: bench_dkvmn_nrm
description: "Benchmark (fixed setup) dkvmn encoder x NRM decoder, static theta, realistic PRIMARY bed (Q=200, admin Uniform(40,80))."

data:
  regime: realistic
  kind: static
  n_learners: 2000
  n_items: 200
  seq_len: 80
  n_cats: 4
  n_holdout: 10
  admin_min: 40
  admin_max: 80
  popularity: uniform
  alpha_sigma: 0.5

model:
  engine: deep_irt
  encoder: dkvmn
  decoder: nrm
  emb_dim: 8
  hidden_dim: 32
  state_alpha: false
  state_beta: false

train:
  optimizer: adam
  n_epochs: 120
  lr: 0.01
  grad_clip_norm: 5.0
  early_stop_patience: 10

eval:
  n_data_seeds: 5
  n_init_seeds: 3
  n_folds: 5
  n_bootstrap: 2000
  gauge: none
  paired_test: wilcoxon

report:
  output_dir: outputs/p2
  cell_name: bench_dkvmn_nrm
  quick: false
