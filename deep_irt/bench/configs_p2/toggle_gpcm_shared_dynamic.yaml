# toggle_gpcm_shared_dynamic.yaml -- GPCM toggle 3/4: shared item key, dynamic (state-conditioned) discrimination head.

experiment: toggle_gpcm_shared_dynamic
description: "GPCM toggle 3/4: shared item key, dynamic (state-conditioned) discrimination head."

data:
  regime: realistic
  kind: static
  n_learners: 2000
  n_items: 200
  seq_len: 80
  n_cats: 4
  n_holdout: 10
  admin_min: 40
  admin_max: 80
  popularity: uniform
  alpha_sigma: 0.5

model:
  engine: deep_irt
  encoder: lstm
  decoder: gpcm
  emb_dim: 8
  hidden_dim: 32
  state_alpha: true
  state_beta: false

train:
  optimizer: adam
  n_epochs: 150
  lr: 0.01
  grad_clip_norm: 5.0
  early_stop_patience: 10
  gpcm_loss: ordinal_ce

eval:
  n_data_seeds: 5
  n_init_seeds: 3
  n_folds: 5
  n_bootstrap: 2000
  gauge: affine
  paired_test: wilcoxon

report:
  output_dir: outputs/p2
  cell_name: toggle_gpcm_shared_dynamic
  quick: false
