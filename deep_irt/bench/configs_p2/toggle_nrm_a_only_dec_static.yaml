# toggle_nrm_a_only_dec_static.yaml -- NRM toggle 3/10: a_only_dec (config 2) -- a_k on its own wide item key; c_k on the thin value; static option readout.

experiment: toggle_nrm_a_only_dec_static
description: "NRM toggle 3/10: a_only_dec (a_k on its own wide item key, c_k on the thin value), static option readout -- informative negative."

data:
  regime: realistic
  kind: static
  n_learners: 2000
  n_items: 200
  seq_len: 80
  n_cats: 4
  n_holdout: 10
  admin_min: 40
  admin_max: 80
  popularity: uniform
  alpha_sigma: 0.5

model:
  engine: deep_irt
  encoder: lstm
  decoder: nrm
  emb_dim: 8
  hidden_dim: 32
  state_alpha: false
  state_beta: false
  nrm_channel: a_only_dec
  item_key_dim: 64

train:
  optimizer: adam
  n_epochs: 150
  lr: 0.01
  grad_clip_norm: 5.0
  early_stop_patience: 10

eval:
  n_data_seeds: 5
  n_init_seeds: 3
  n_folds: 5
  n_bootstrap: 2000
  gauge: none
  paired_test: wilcoxon

report:
  output_dir: outputs/p2
  cell_name: toggle_nrm_a_only_dec_static
  quick: false
