# smoke_realistic_gpcm.yaml -- corrected-bed smoke, GPCM cell (random selection).
# Q=40 bank, admin Uniform(15,30) distinct items/learner (theta-independent,
# WITHOUT replacement), N=300, clean GPCM draws, seen-set scoring. Pipeline
# check only (recovery numbers, not recovery quality).
# Run: python -m deep_irt.bench._p2_run_cell configs_p2/smoke_realistic_gpcm.yaml --quick

experiment: smoke_realistic_gpcm
description: "Corrected-bed smoke: LSTM+GPCM on the admin-noise bed, random selection."

data:
  regime: realistic
  kind: static
  n_learners: 300
  n_items: 40
  seq_len: 30
  n_cats: 4
  n_holdout: 5
  admin_min: 15
  admin_max: 30
  dense: false
  popularity: uniform
  alpha_sigma: 0.5

model:
  engine: deep_irt
  encoder: lstm
  decoder: gpcm
  emb_dim: 8
  hidden_dim: 32

train:
  optimizer: adam
  n_epochs: 10
  lr: 1.0e-2
  gpcm_loss: ordinal_ce

eval:
  n_data_seeds: 1
  n_init_seeds: 1
  n_folds: 2
  n_bootstrap: 200
  gauge: affine

report:
  output_dir: outputs/p2
  cell_name: smoke_realistic_gpcm
  quick: true
