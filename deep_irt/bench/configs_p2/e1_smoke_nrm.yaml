# e1_smoke_nrm.yaml -- Quick smoke test for the NRM decoder recovery path.
# The clean GPCM bed emits no NRM ground truth (a_k, c_k), so the NRM recovery
# path only scores on the realistic bed (regime: realistic), whose generator
# (_p2_datagen_realistic) emits aux["nrm_a"]/aux["nrm_c"].  dense=true (every
# learner sees all Q items) keeps the bed rectangular so this is a pure
# NRM-recovery smoke with maximal per-item coverage.
# Run: python -m deep_irt.bench._p2_run_cell configs_p2/e1_smoke_nrm.yaml --device cpu --quick

experiment: e1_smoke_nrm
description: "E1 smoke: LSTM+NRM on the realistic bed, 1 data seed x 2 folds. Verify NRM recovery pipeline only."

data:
  regime: realistic
  kind: static
  n_learners: 150
  n_items: 12
  seq_len: 12
  n_cats: 4
  n_holdout: 5
  dense: true
  popularity: uniform

model:
  engine: deep_irt
  encoder: lstm
  decoder: nrm
  emb_dim: 8
  hidden_dim: 32

train:
  optimizer: adam
  n_epochs: 10
  lr: 1.0e-2

eval:
  n_data_seeds: 1
  n_init_seeds: 1
  n_bootstrap: 200
  gauge: none

report:
  output_dir: outputs/p2
  cell_name: e1_smoke_nrm
  quick: true
