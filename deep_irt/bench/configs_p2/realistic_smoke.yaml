# realistic_smoke.yaml -- fast pipeline check on the CORRECTED realistic bed.
# admin Uniform(12,24) on a Q=40 bank; verifies variable-length + seen-mask.
# Run: python -m deep_irt.bench._p2_run_cell configs_p2/realistic_smoke.yaml --quick

experiment: realistic_smoke
description: "Realistic-bed smoke: LSTM+GPCM on the admin-noise bed, pipeline only."

data:
  regime: realistic
  kind: static
  n_learners: 150
  n_items: 40
  seq_len: 24
  n_cats: 4
  n_holdout: 5
  admin_min: 12
  admin_max: 24
  popularity: uniform
  alpha_sigma: 0.5

model:
  engine: deep_irt
  encoder: lstm
  decoder: gpcm
  emb_dim: 8
  hidden_dim: 32

train:
  optimizer: adam
  n_epochs: 10
  lr: 1.0e-2
  gpcm_loss: ordinal_ce

eval:
  n_data_seeds: 1
  n_init_seeds: 1
  n_folds: 2
  n_bootstrap: 200
  gauge: affine

report:
  output_dir: outputs/p2
  cell_name: realistic_smoke
  quick: true
